<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeVerse | Boutique Watch Collection</title>
    
    <!-- Link Stylesheets -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/product.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <style>
        /* Compact Premium Luxury Collection Banner for Products Showroom */
        .showroom-page-header {
            margin-top: 80px;
            height: 200px;
            min-height: 180px;
            max-height: 210px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #FBF9F5 0%, #F5F1E8 50%, #FAF8F5 100%);
            border-bottom: 1px solid rgba(197, 160, 89, 0.25);
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        body:not(.light-theme) .showroom-page-header {
            background: linear-gradient(135deg, #0d0d0f 0%, #151518 50%, #0d0d0f 100%);
            border-bottom: 1px solid rgba(197, 160, 89, 0.15);
        }

        .showroom-page-header .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
        }

        .showroom-page-header h1 {
            font-family: 'Cinzel', serif !important;
            font-size: 2.3rem !important;
            font-weight: 700 !important;
            letter-spacing: 1px !important;
            color: #121212 !important;
            margin: 0 0 10px 0 !important;
            line-height: 1.2 !important;
        }

        body:not(.light-theme) .showroom-page-header h1 {
            color: #FFFFFF !important;
        }

        .showroom-page-header .breadcrumbs {
            font-family: 'Poppins', sans-serif !important;
            font-size: 0.85rem !important;
            letter-spacing: 0.5px !important;
            color: #6B6862 !important;
            margin-top: 0 !important;
            font-weight: 500 !important;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        body:not(.light-theme) .showroom-page-header .breadcrumbs {
            color: #94A3B8 !important;
        }

        .showroom-page-header .breadcrumbs a {
            color: #1F3A5F !important;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .showroom-page-header .breadcrumbs a:hover {
            color: #C5A059 !important;
        }

        body:not(.light-theme) .showroom-page-header .breadcrumbs a {
            color: #E8D7B3 !important;
        }

        .showroom-page-header .breadcrumbs span.sep {
            color: #C5A059 !important;
            font-weight: 600;
        }

        .showroom-page-header .breadcrumbs span.current {
            color: #C5A059 !important;
            font-weight: 600;
        }

        @media (max-width: 992px) {
            .showroom-page-header {
                height: 175px;
                min-height: 160px;
            }
            .showroom-page-header h1 {
                font-size: 2rem !important;
            }
        }

        @media (max-width: 768px) {
            .showroom-page-header {
                height: 155px;
                min-height: 140px;
            }
            .showroom-page-header h1 {
                font-size: 1.75rem !important;
            }
            .showroom-page-header .breadcrumbs {
                font-size: 0.78rem !important;
            }
        }
    </style>
</head>
<body>

    <!-- Header Holder -->
    <header></header>

    <!-- Page Header Hero (Compact Luxury Collection Banner) -->
    <section class="showroom-page-header">
        <div class="container">
            <h1>The Showroom</h1>
            <div class="breadcrumbs">
                <a href="./index.html">Home</a> <span class="sep">/</span> <span class="current">Collection</span>
            </div>
        </div>
    </section>

    <!-- Filters and Grid Layout -->
    <div class="container">
        <div class="filter-layout">
            
            <!-- Sidebar Filters -->
            <aside class="filter-sidebar glass-panel" style="border-radius: 12px; padding: 25px; box-shadow: var(--border-glow);">
                <!-- Search widget inside sidebar for mobile cohesion -->
                <div class="filter-widget">
                    <h4 class="filter-widget-title">Search Showroom</h4>
                    <div style="position: relative;">
                        <input type="text" id="catalog-search" class="form-control" placeholder="Search timepieces...">
                    </div>
                </div>

                <!-- Categories -->
                <div class="filter-widget">
                    <h4 class="filter-widget-title">Categories</h4>
                    <ul class="filter-categories-list" id="categories-list">
                        <!-- Loaded dynamically from Category API -->
                        <li class="filter-category-item"><span class="filter-category-link active">Loading...</span></li>
                    </ul>
                </div>

                <!-- Price Filter -->
                <div class="filter-widget">
                    <h4 class="filter-widget-title">Filter by Price</h4>
                    <div class="price-range-inputs">
                        <input type="number" id="price-min" class="form-control" placeholder="Min (₹)" min="0">
                        <input type="number" id="price-max" class="form-control" placeholder="Max (₹)" min="0">
                    </div>
                    <button class="btn-luxury btn-luxury-solid" id="apply-price-btn" style="width: 100%; margin-top: 15px; padding: 8px; font-size: 0.8rem;">Apply Price</button>
                </div>

                <!-- Stock Filter -->
                <div class="filter-widget">
                    <h4 class="filter-widget-title">Availability</h4>
                    <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--light-gray);">
                        <input type="checkbox" id="filter-instock" style="accent-color: var(--gold); width: 18px; height: 18px;">
                        In Stock Only
                    </label>
                </div>
            </aside>

            <!-- Main catalog view -->
            <main class="filter-main">
                <div class="catalog-controls">
                    <div>
                        <!-- Counter or detail indicator can go here -->
                        <span style="color: var(--light-gray);">Exquisite mechanical watches, handpicked for you.</span>
                    </div>
                    <div>
                        <select id="catalog-sort" class="form-control" style="width: 220px; padding: 8px 15px; font-size: 0.85rem;">
                            <option value="">Sort: Default</option>
                            <option value="price-asc">Price: Low to High</option>
                            <option value="price-desc">Price: High to Low</option>
                            <option value="name-asc">Alphabetical: A-Z</option>
                            <option value="productId-desc">Newest First</option>
                        </select>
                    </div>
                </div>

                <!-- Products Display Grid -->
                <div class="product-grid" id="catalog-products-grid">
                    <!-- Cards injected dynamically by products.js -->
                </div>

                <!-- Pagination Container -->
                <div class="pagination-container flex-between" id="catalog-pagination" style="margin-top: 50px; justify-content: center; gap: 8px;">
                    <!-- Controls injected dynamically -->
                </div>
            </main>

        </div>
    </div>

    <!-- Footer Holder -->
    <footer></footer>

    <!-- Component Logic Scripts -->
    <script src="../components/loader.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../components/alert.js"></script>
    <script src="../components/product-card.js"></script>
    <script src="../components/footer.js"></script>
    <script src="../components/navbar.js"></script>
    
    <!-- Page Specific Script -->
    <script src="../js/products.js"></script>
</body>
</html>
